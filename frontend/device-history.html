<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IoT Monitoring System - Device History</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body data-page="device-history">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-profile">
        <div class="avatar"><img src="assets/images/nguyen-quang-huy-avatar.png" alt="Ảnh đại diện người dùng"></div>
        <p class="sidebar-name" data-user-name>Nguyễn Quang Huy</p>
        <a class="profile-link" href="profile.html">View Profile</a>
      </div>
      <nav class="sidebar-nav" aria-label="Primary">
        <a class="nav-item" href="dashboard.html"><i class="bx bx-grid-alt icon-sm"></i><span class="nav-label">Dashboard</span></a>
        <a class="nav-item" href="sensor-data.html"><i class="bx bx-data icon-sm"></i><span class="nav-label">Sensor Data</span></a>
        <a class="nav-item active" href="device-history.html"><i class="bx bx-history icon-sm"></i><span class="nav-label">Device History</span></a>
      </nav>
      <button class="logout-link" type="button" data-logout><i class="bx bx-log-out icon-sm"></i><span class="nav-label">Logout</span></button>
    </aside>

    <main class="content">
      <h1 class="page-title">Device History</h1>
      <section class="card data-card">
        <form id="device-history-filter-form" class="history-filter-row">
          <input id="history-time" class="control" type="text" placeholder="Năm-tháng-ngày giờ:phút:giây" aria-label="Thời gian">
          <select id="history-device" class="select-control" aria-label="Thiết bị"><option value="">Tất cả thiết bị</option><option value="1">Light 1</option><option value="2">Light 2</option></select>
          <select id="history-action" class="select-control" aria-label="Hành động"><option value="">Action: Tất cả</option><option value="ON">ON</option><option value="OFF">OFF</option></select>
          <select id="history-status" class="select-control" aria-label="Trạng thái"><option value="">Status: Tất cả</option><option value="ON">ON</option><option value="OFF">OFF</option><option value="LOADING">LOADING</option><option value="FAILED">FAILED</option></select>
          <button class="search-button" type="submit"><i class="bx bx-search icon-sm"></i>Search</button>
          <div class="sort-control">
            <div class="sort-button"><i class="bx bx-sort-alt-2 icon-sm"></i><span>Sort</span></div>
            <select id="history-sort" class="sort-select" aria-label="Sắp xếp lịch sử điều khiển">
              <option value="id:asc">ID: Tăng dần</option>
              <option value="id:desc">ID: Giảm dần</option>
              <option value="time:asc">Thời gian: Tăng dần</option>
              <option value="time:desc" selected>Thời gian: Giảm dần</option>
            </select>
          </div>
        </form>

        <div class="table-wrap">
          <table class="data-table">
            <colgroup><col style="width:7%"><col style="width:15%"><col style="width:15%"><col style="width:14%"><col style="width:16%"><col style="width:33%"></colgroup>
            <thead><tr><th>ID</th><th>Tên thiết bị</th><th>Hành động</th><th>Trạng thái</th><th>Tên người dùng</th><th>Thời gian</th></tr></thead>
            <tbody id="device-history-body"><tr><td colspan="6" class="empty-cell">Đang tải dữ liệu...</td></tr></tbody>
          </table>
        </div>
        <div class="pagination">
          <label class="page-size-control">Số dòng / trang:
            <select id="history-page-size" class="page-size-select"><option value="5">5</option><option value="10" selected>10</option><option value="20">20</option><option value="50">50</option></select>
          </label>
          <div id="history-pagination" class="page-buttons"></div>
        </div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/core/config.js"></script>
  <script src="js/core/session.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/pages/device-history.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
