<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IoT Monitoring System - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body data-page="dashboard">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-profile">
        <div class="avatar"><img src="assets/images/nguyen-quang-huy-avatar.png" alt="Ảnh đại diện người dùng"></div>
        <p class="sidebar-name" data-user-name>Nguyễn Quang Huy</p>
        <a class="profile-link" href="profile.html">View Profile</a>
      </div>
      <nav class="sidebar-nav" aria-label="Primary">
        <a class="nav-item active" href="dashboard.html"><i class="bx bx-grid-alt icon-sm"></i><span class="nav-label">Dashboard</span></a>
        <a class="nav-item" href="sensor-data.html"><i class="bx bx-data icon-sm"></i><span class="nav-label">Sensor Data</span></a>
        <a class="nav-item" href="device-history.html"><i class="bx bx-history icon-sm"></i><span class="nav-label">Device History</span></a>
      </nav>
      <button class="logout-link" type="button" data-logout><i class="bx bx-log-out icon-sm"></i><span class="nav-label">Logout</span></button>
    </aside>

    <main class="content">
      <div class="title-row"><h1 class="page-title">Dashboard</h1><span id="realtime-status" class="realtime-status">Offline</span></div>
      <section class="metric-grid">
        <article class="card metric-card">
          <div class="metric-icon temp"><i class="bx bxs-thermometer icon"></i></div>
          <div><p class="metric-label">Temperature</p><p class="metric-value"><span id="temperature-value">--</span> <span class="metric-unit">°C</span></p><div class="metric-update" data-latest-time>Waiting for data</div></div>
        </article>
        <article class="card metric-card">
          <div class="metric-icon hum"><i class="bx bx-droplet icon"></i></div>
          <div><p class="metric-label">Humidity</p><p class="metric-value"><span id="humidity-value">--</span> <span class="metric-unit">%</span></p><div class="metric-update" data-latest-time>Waiting for data</div></div>
        </article>
        <article class="card metric-card">
          <div class="metric-icon light"><i class="bx bx-sun icon"></i></div>
          <div><p class="metric-label">Light</p><p class="metric-value"><span id="light-value">--</span> <span class="metric-unit">lux</span></p><div class="metric-update" data-latest-time>Waiting for data</div></div>
        </article>
      </section>

      <section class="dashboard-main">
        <article class="card chart-card">
          <h2 class="section-title">Sensor Chart</h2>
          <div class="chart-legend" aria-label="Chart legend">
            <span class="legend-item"><span class="legend-dot blue"></span>Temperature (°C)</span>
            <span class="legend-item"><span class="legend-dot green"></span>Humidity (%)</span>
            <span class="legend-item"><span class="legend-dot orange"></span>Light (lux)</span>
          </div>
          <div class="chart-canvas-wrap"><canvas id="sensorChart" aria-label="Biểu đồ dữ liệu cảm biến"></canvas></div>
        </article>

        <article class="card device-card">
          <h2 class="section-title">Device Control</h2>
          <div id="device-list" class="device-list"><p class="empty-message">Đang tải trạng thái...</p></div>
        </article>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/chart.js"></script>
  <script src="js/core/config.js"></script>
  <script src="js/core/session.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/stomp-client.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
